{% extends 'base.html' %}
{% block content %}
<h2>Students</h2>

<table>
<tr>
    <th>Name</th>
    <th>Roll No</th>
    <th>Department</th>
    <th>Course</th>
</tr>
{% for student in students %}
<tr>
    <td>{{ student.name }}</td>
    <td>{{ student.roll_no }}</td>
    <td>{{ student.department.name }}</td>
    <td>{{ student.course.name }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
