{% extends 'base.html' %}
{% block title %}Results{% endblock %}
{% block content %}
<h2>Results</h2>

<table>
<tr>
    <th>Student</th>
    <th>Subject</th>
    <th>Marks</th>
    <th>Grade</th>
</tr>
{% for r in results %}
<tr>
    <td>{{ r.student.name }}</td>
    <td>{{ r.subject.name }}</td>
    <td>{{ r.marks }}</td>
    <td>{{ r.grade }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
