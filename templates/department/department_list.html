{% extends 'base.html' %}
{% block title %}Departments{% endblock %}

{% block content %}
<h2>Department List</h2>
<a href="#">Add Department</a>

<table>
<tr>
    <th>Name</th>
    <th>Code</th>
</tr>
{% for dept in departments %}
<tr>
    <td>{{ dept.name }}</td>
    <td>{{ dept.code }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
